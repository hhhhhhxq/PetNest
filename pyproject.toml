[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "petnest"
version = "0.1.5"
description = "配置驱动的跨平台轻量桌面宠物播放器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4,<12",
    "PySide6>=6.7,<7",
    "rlottie-python>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
