<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F1EA"/>
      <stop offset="0.48" stop-color="#EEDFD6"/>
      <stop offset="1" stop-color="#E4D1C8"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#F7EEE7" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#FBF3EC" stop-opacity="0.86"/>
    </linearGradient>
    <filter id="blur45" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#806456" flood-opacity="0.20"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#9A7668" flood-opacity="0.10"/>
    </filter>
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#FBF5F0"/>
      <rect width="9" height="9" fill="#F2E7DF"/>
      <rect x="9" y="9" width="9" height="9" fill="#F2E7DF"/>
    </pattern>
    <clipPath id="canvasClip"><rect width="1600" height="1050" rx="34"/></clipPath>
    <clipPath id="frame1"><rect x="601" y="397" width="136" height="148" rx="10"/></clipPath>
    <clipPath id="frame2"><rect x="799" y="397" width="136" height="148" rx="10"/></clipPath>
    <clipPath id="frame3"><rect x="997" y="397" width="136" height="148" rx="10"/></clipPath>
