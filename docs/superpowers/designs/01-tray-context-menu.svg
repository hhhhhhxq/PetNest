      <rect x="896" y="274" width="438" height="86" rx="18" fill="#FFF8F3" fill-opacity="0.86"/>
      <circle cx="934" cy="317" r="24" fill="#D98663"/>
      <path d="M922 317 C922 309 927 305 932 308 C935 302 941 304 942 310 C949 309 951 316 948 321 C944 328 926 328 922 317Z" fill="#FFFDF9"/>
