        <rect x="194" y="378" width="446" height="42" rx="11" fill="url(#accentSoft)" fill-opacity="0.48"/>
        <text x="242" y="405">显示桌宠</text>
        <text x="610" y="405" text-anchor="end" fill="#C47A5B" font-size="14">⌘</text>

        <text x="242" y="449">暂停动画</text>
        <text x="610" y="449" text-anchor="end" fill="#A9958A" font-size="14">⌘</text>

        <text x="242" y="493">始终置顶</text>
        <path d="M600 487 l7 7 l13 -15" fill="none" stroke="#D98663" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="242" y="537">跟随鼠标</text>
        <path d="M600 531 l7 7 l13 -15" fill="none" stroke="#D98663" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

        <line x1="218" y1="562" x2="616" y2="562" stroke="#E8DED5" stroke-width="1"/>

        <text x="242" y="607">切换宠物</text>
        <path d="M608 598 l7 7 l-7 7" fill="none" stroke="#A7978E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="242" y="651">互动…</text>

        <line x1="218" y1="676" x2="616" y2="676" stroke="#E8DED5" stroke-width="1"/>

        <text x="242" y="721">宠物库</text>
        <path d="M608 712 l7 7 l-7 7" fill="none" stroke="#A7978E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="242" y="765">设置…</text>
        <text x="242" y="809">鼠标样式…</text>
        <text x="242" y="853">检查资源更新</text>
        <circle cx="608" cy="848" r="5" fill="#5A9BE8"/>

        <line x1="218" y1="878" x2="616" y2="878" stroke="#E8DED5" stroke-width="1"/>

        <text x="242" y="907" fill="#C06C60">退出 PetNest</text>
