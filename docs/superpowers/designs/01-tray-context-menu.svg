        <text x="944" y="405">显示桌宠</text>
        <text x="1304" y="405" text-anchor="end" fill="#C47A5B" font-size="14">⌘</text>
        <text x="944" y="449">暂停动画</text>
        <text x="944" y="493">始终置顶</text>
        <path d="M1294 487 l7 7 l13 -15" fill="none" stroke="#D98663" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="944" y="537">跟随鼠标</text>
        <path d="M1294 531 l7 7 l13 -15" fill="none" stroke="#D98663" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="920" y1="562" x2="1310" y2="562" stroke="#E8DED5" stroke-width="1"/>
        <text x="944" y="607">切换宠物</text>
        <path d="M1302 598 l7 7 l-7 7" fill="none" stroke="#A7978E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="944" y="651">互动…</text>
        <line x1="920" y1="676" x2="1310" y2="676" stroke="#E8DED5" stroke-width="1"/>
        <rect x="896" y="690" width="438" height="42" rx="11" fill="url(#accentSoft)" fill-opacity="0.70"/>
        <text x="944" y="717" fill="#A85D3E" font-weight="600">宠物库</text>
        <path d="M1302 708 l7 7 l-7 7" fill="none" stroke="#D98663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="944" y="761">设置…</text>
        <text x="944" y="805">鼠标样式…</text>
        <text x="944" y="849">检查资源更新</text>
        <circle cx="1302" cy="844" r="5" fill="#5A9BE8"/>
        <line x1="920" y1="874" x2="1310" y2="874" stroke="#E8DED5" stroke-width="1"/>
        <text x="944" y="903" fill="#C06C60">退出 PetNest</text>
      </g>

      <!-- library submenu -->
      <g filter="url(#smallShadow)">
        <rect x="1328" y="602" width="230" height="260" rx="20" fill="url(#menuSurface)" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2"/>
        <text x="1354" y="636" fill="#9A8B82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">宠物库</text>
        <line x1="1350" y1="651" x2="1536" y2="651" stroke="#E8DED5" stroke-width="1"/>
        <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#554C47">
          <rect x="1342" y="665" width="202" height="36" rx="9" fill="#FFF0E8"/>
          <text x="1360" y="689" fill="#A85D3E" font-weight="600">导入精灵图…</text>
          <text x="1360" y="729">打开宠物文件夹</text>
          <text x="1360" y="769">刷新宠物列表</text>
          <text x="1360" y="809">编辑动画时长…</text>
          <text x="1360" y="849">重新加载当前宠物</text>
        </g>
      </g>
    </g>

    <!-- Callouts -->
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <path d="M680 382 C720 382 724 370 760 370" fill="none" stroke="#D98663" stroke-width="1.5" stroke-dasharray="5 5"/>
      <circle cx="680" cy="382" r="4" fill="#D98663"/>
      <rect x="730" y="334" width="120" height="54" rx="14" fill="#FFFDF9" fill-opacity="0.78" stroke="#FFFFFF"/>
      <text x="790" y="356" text-anchor="middle" fill="#8B6D5C" font-size="13" font-weight="600">即时操作</text>
      <text x="790" y="376" text-anchor="middle" fill="#A7978E" font-size="12">顶部优先</text>

      <path d="M1354 808 C1410 808 1418 786 1450 786" fill="none" stroke="#D98663" stroke-width="1.5" stroke-dasharray="5 5"/>
      <circle cx="1354" cy="808" r="4" fill="#D98663"/>
      <rect x="1448" y="744" width="120" height="74" rx="14" fill="#FFFDF9" fill-opacity="0.78" stroke="#FFFFFF"/>
      <text x="1508" y="768" text-anchor="middle" fill="#8B6D5C" font-size="13" font-weight="600">管理操作</text>
      <text x="1508" y="789" text-anchor="middle" fill="#A7978E" font-size="12">收进子菜单</text>
      <text x="1508" y="807" text-anchor="middle" fill="#A7978E" font-size="12">降低干扰</text>
    </g>
