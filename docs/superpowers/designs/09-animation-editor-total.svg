<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F1EA"/>
      <stop offset="0.48" stop-color="#EEDFD6"/>
      <stop offset="1" stop-color="#E4D1C8"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#F7EEE7" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#FBF3EC" stop-opacity="0.86"/>
    </linearGradient>
    <filter id="blur45" x="-20%" y="-20%" width="140%" height="140%">
