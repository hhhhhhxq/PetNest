      <rect width="11" height="11" fill="#F2E7DF"/>
      <rect x="11" y="11" width="11" height="11" fill="#F2E7DF"/>
    </pattern>
    <clipPath id="canvasClip"><rect width="1600" height="1050" rx="34"/></clipPath>
    <clipPath id="previewClip"><rect x="1102" y="342" width="316" height="326" rx="20"/></clipPath>
  </defs>

