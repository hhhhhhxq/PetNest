name: Keyboard cat cross-platform parity

on:
  push:
    branches: [main, 'codex/unify-keyboard-cat']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' PySide6==6.12.0
      - name: Shared artwork, animation, input and editor regressions
        run: python -m pytest -q tests/test_cat_shared_renderer.py tests/test_cat_appearance.py tests/test_cat_animation.py tests/test_keyboard_cat.py tests/test_keyboard_activity.py tests/test_pet_library_layout.py
      - run: python tools/render_cat_parity.py render build/cat-parity
      - uses: actions/upload-artifact@v4
        with:
          name: cat-${{ matrix.os }}
          path: build/cat-parity

  compare:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: build/parity-results
      - run: python -m pip install 'Pillow>=10.4,<12'
      - run: python tools/render_cat_parity.py compare build/parity-results/cat-macos-latest build/parity-results/cat-windows-latest
